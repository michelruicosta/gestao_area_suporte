<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acesso | Finaudtec</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-display {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.6s ease-out forwards; }
    </style>
</head>
<body>

    <div class="w-full max-w-md px-6 animate-fade text-center">
        <div class="mb-10">
            <div class="inline-block mb-4">
                <img src="https://i.postimg.cc/FKRT42kT/logo-finaud.png" 
                     alt="Finaudtec" 
                     class="h-20 w-auto object-contain logo-display">
            </div>
            <p class="text-slate-400 text-[11px] font-bold uppercase tracking-[0.3em] opacity-80">
                Recuperação de Acesso
            </p>
        </div>

        <div class="glass-card rounded-3xl p-8 text-left">
            <h2 class="text-xl font-bold text-white mb-2">Esqueceu a senha?</h2>
            <p class="text-slate-400 text-xs mb-6 leading-relaxed">
                Insira seu e-mail corporativo cadastrado. Enviaremos um link seguro para você redefinir sua senha de acesso.
            </p>
            
            <form action="{{ url_for('recuperar_senha') }}" method="POST" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">E-mail Corporativo</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input type="email" name="email" required 
                               style="padding-left: 45px !important;"
                               class="w-full bg-slate-900/50 border border-slate-700 text-white text-sm rounded-xl py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all"
                               placeholder="exemplo@finaud.com">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-blue-500/20">
                    ENVIAR LINK DE RECUPERAÇÃO
                </button>
            </form>
            
            <div class="mt-8 text-center border-t border-slate-700 pt-6">
                <a href="{{ url_for('login') }}" class="text-xs text-slate-500 hover:text-white transition flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-left"></i> Voltar para o Login
                </a>
            </div>
        </div>

        <p class="text-slate-600 text-[10px] mt-8 uppercase tracking-widest">
            &copy; 2026 Finaud Tec Soluções em Tecnologia Ltda. &bull; Suporte Técnico
        </p>
    </div>

</body>
</html>
