<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso | Gestão de E-mail</title>
<style>
:root {
  --marca: #3333a8;
  --marca-hover: #2828a0;
  font-family: "Segoe UI", system-ui, sans-serif;
  line-height: 1.5;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--marca);
  padding: 1.5rem;
}

.login-card {
  width: 100%;
  max-width: 400px;
  background: #fff;
  border: 1px solid #e2e5ea;
  border-radius: 12px;
  padding: 2.25rem 2rem;
  box-shadow: 0 20px 48px rgba(0,0,0,0.28);
}

.marca-org {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  margin-bottom: 1.75rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid #e2e5ea;
}

.marca-logo {
  width: 3.25rem;
  height: 3.25rem;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--marca);
  display: flex;
  align-items: center;
  justify-content: center;
}

.marca-logo img { width: 100%; height: 100%; object-fit: contain; }

.marca-logo-inicial {
  color: #fff;
  font-weight: 700;
  font-size: 1.35rem;
}

.marca-textos { display: flex; flex-direction: column; gap: 0.1rem; }
.marca-nome   { font-size: 1.1rem; font-weight: 700; color: #1e293b; line-height: 1.2; }
.marca-sub    { font-size: 0.84rem; color: #64748b; }

.field       { display: grid; gap: 0.35rem; margin-bottom: 1rem; }
.field-label { font-weight: 600; font-size: 0.88rem; color: #334155; }
.field-input {
  width: 100%;
  padding: 0.65rem 0.85rem;
  border: 1px solid #c5cad3;
  border-radius: 8px;
  background: #fff;
  font: inherit;
  color: #1e293b;
  outline: none;
  transition: border-color 0.15s;
}
.field-input:focus { border-color: var(--marca); }

.erro-msg {
  font-size: 0.88rem;
  color: #b4233a;
  background: #fef2f2;
  border: 1px solid #fecdca;
  border-radius: 6px;
  padding: 0.65rem 0.85rem;
  margin-bottom: 1rem;
}

.btn-entrar {
  width: 100%;
  padding: 0.75rem;
  background: var(--marca);
  color: #fff;
  border: none;
  border-radius: 8px;
  font: inherit;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 0.35rem;
}
.btn-entrar:hover { background: var(--marca-hover); }

.rodape-login {
  margin-top: 1.5rem;
  text-align: center;
  font-size: 0.78rem;
  color: #94a3b8;
}
</style>
</head>
<body>
  <div class="login-card">
    <div class="marca-org">
      <div class="marca-logo">
        <img src="/static/img/logo_finaud.png" alt="Finaud"
             onerror="this.parentElement.innerHTML='<span class=\'marca-logo-inicial\'>F</span>'">
      </div>
      <div class="marca-textos">
        <span class="marca-nome">Finaud Tec</span>
        <span class="marca-sub">Gestão de E-mail · Oráculo 360</span>
      </div>
    </div>

    {% if erro %}
    <p class="erro-msg">{{ erro }}</p>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
      <div class="field">
        <label class="field-label" for="email">E-mail corporativo</label>
        <input class="field-input" type="email" id="email" name="email"
               autocomplete="username" placeholder="nome@finaud.com.br" required>
      </div>

      <div class="field">
        <label class="field-label" for="senha">Senha</label>
        <input class="field-input" type="password" id="senha" name="senha"
               autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-entrar">Entrar</button>
    </form>

    <p class="rodape-login">© 2026 Finaud Tec · Ambiente seguro</p>
  </div>
</body>
</html>
