<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso | Gestão Área Suporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: #060b18;
  font-family: Outfit, "Segoe UI", system-ui, sans-serif;
  color: #f4f6fb;
  line-height: 1.5;
}

body::before {
  content: "";
  position: absolute;
  inset: -20%;
  z-index: -1;
  background:
    radial-gradient(ellipse 70% 58% at 90% -4%, rgba(163, 209, 51, 0.58), transparent 56%),
    radial-gradient(ellipse 62% 68% at -4% 104%, rgba(0, 28, 91, 0.95), transparent 52%),
    radial-gradient(ellipse 50% 46% at 52% 42%, rgba(77, 122, 212, 0.28), transparent 62%);
  pointer-events: none;
}

.login-card {
  width: 100%;
  max-width: 420px;
  border-radius: 24px;
  border: 1px solid rgba(163, 209, 51, 0.16);
  background:
    radial-gradient(ellipse 90% 70% at 8% 108%, rgba(163, 209, 51, 0.16), transparent 52%),
    radial-gradient(ellipse 85% 65% at 108% -8%, rgba(0, 28, 91, 0.55), transparent 50%),
    linear-gradient(165deg, #0b142c 0%, #02050c 72%);
  color: #f4f6fb;
  padding: 2.25rem 2rem 1.75rem;
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.4),
    0 32px 90px rgba(0, 8, 24, 0.7);
}

/* Topo */
.login-topo {
  text-align: center;
  margin-bottom: 1.75rem;
}

.login-ico {
  width: 48px;
  height: 48px;
  margin: 0 auto 0.85rem;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: rgba(163, 209, 51, 0.18);
  color: #b4d84a;
}

.login-ico svg {
  width: 26px;
  height: 26px;
}

.login-kicker {
  margin: 0 0 0.5rem;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: rgba(244, 246, 251, 0.55);
}

.login-titulo {
  margin: 0 0 0.35rem;
  font-size: 1.45rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #f4f6fb;
}

.login-sub {
  margin: 0;
  color: rgba(244, 246, 251, 0.58);
  font-size: 0.95rem;
}

/* Campos */
.field {
  display: grid;
  gap: 0.35rem;
  margin-bottom: 1rem;
}

.field-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(244, 246, 251, 0.58);
}

.field-input {
  width: 100%;
  padding: 0.65rem 0.85rem;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.06);
  color: #f4f6fb;
  font: inherit;
  outline: none;
  transition: border-color 0.15s;
}

.field-input:focus {
  border-color: rgba(163, 209, 51, 0.55);
}

.field-input::placeholder {
  color: rgba(244, 246, 251, 0.28);
}

/* Campo senha — olho dentro da caixa (padrão Leiautes / CampoSenha) */
.campo-senha-wrap {
  position: relative;
}

.campo-senha-wrap .field-input {
  padding-right: 2.75rem;
}

.campo-senha-toggle {
  position: absolute;
  top: 50%;
  right: 0.45rem;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  padding: 0;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: rgba(244, 246, 251, 0.58);
  cursor: pointer;
}

.campo-senha-toggle:hover {
  color: #f4f6fb;
  background: rgba(255, 255, 255, 0.08);
}

.campo-senha-toggle svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

/* Erro */
.erro-msg {
  color: #ffb4ab;
  font-size: 0.9rem;
  margin: 0 0 1rem;
  white-space: pre-line;
}

/* Botão Entrar */
.btn-entrar {
  width: 100%;
  padding: 0.75rem;
  background: #b4d84a;
  color: #0c1408;
  border: 0;
  border-radius: 12px;
  font: inherit;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  margin-top: 0.5rem;
  transition: background 0.15s;
}

.btn-entrar:hover { background: #a3d133; }
.btn-entrar:disabled { background: #7a9133; color: #0c1408; cursor: default; }

/* Link portal */
.portal-link {
  display: block;
  margin-top: 1rem;
  text-align: center;
  font-size: 13px;
  color: rgba(244, 246, 251, 0.58);
  text-decoration: underline;
}

.portal-link:hover { color: #f4f6fb; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-topo">
      <div class="login-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m2 7 10 7 10-7"/>
        </svg>
      </div>
      <p class="login-kicker">Grupo Finaud</p>
      <h1 class="login-titulo">Gestão Área Suporte</h1>
      <p class="login-sub">E-mails · Área de Suporte</p>
    </div>

    <div id="bloco-login">
      {% if erro %}
      <p class="erro-msg">{{ erro }}</p>
      {% endif %}

      <form id="form-login" action="{{ url_for('login') }}" method="POST">
        <div class="field">
          <label class="field-label" for="email">E-mail corporativo</label>
          <input class="field-input" type="email" id="email" name="email"
                 autocomplete="username" placeholder="nome@finaud.com.br" required>
        </div>

        <div class="field">
          <label class="field-label" for="senha">Senha</label>
          <div class="campo-senha-wrap">
            <input class="field-input" type="password" id="senha" name="senha"
                   autocomplete="current-password" required>
            <button type="button" class="campo-senha-toggle" id="olho-btn"
                    aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path id="olho-path" d="M2.5 12c1-3 4.5-7 9.5-7s8.5 4 9.5 7c-1 3-4.5 7-9.5 7s-8.5-4-9.5-7Z M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-entrar">Entrar</button>
      </form>
    </div>

    <a class="portal-link" href="{{ portal_url }}">Portal de apps</a>
  </div>

<script>
(function () {
  var inp = document.getElementById('senha');
  var btn = document.getElementById('olho-btn');
  var path = document.getElementById('olho-path');
  var olhoAberto = 'M2.5 12c1-3 4.5-7 9.5-7s8.5 4 9.5 7c-1 3-4.5 7-9.5 7s-8.5-4-9.5-7Z M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z';
  var olhoFechado = 'M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A9.8 9.8 0 0 1 12 5c5 0 8.5 4 9.5 7a10.7 10.7 0 0 1-2.2 3.5M6.7 6.7A10.8 10.8 0 0 0 2.5 12c1 3 4.5 7 9.5 7 1.5 0 2.9-.4 4.1-1';

  btn.addEventListener('click', function () {
    var ver = inp.type === 'password';
    inp.type = ver ? 'text' : 'password';
    btn.setAttribute('aria-label', ver ? 'Ocultar senha' : 'Mostrar senha');
    btn.setAttribute('aria-pressed', ver ? 'true' : 'false');
    btn.setAttribute('title', ver ? 'Ocultar senha' : 'Mostrar senha');
    path.setAttribute('d', ver ? olhoFechado : olhoAberto);
  });
})();
</script>
</body>
</html>
