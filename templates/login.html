<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso | Oráculo 360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Variáveis Light (Clear) */
            --bg-body: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-bg: #ffffff;
            --border-color: #e2e8f0;
            --grad-1: rgba(59, 130, 246, 0.05);
            --grad-2: rgba(148, 163, 184, 0.1);
        }

        .dark-mode {
            /* Variáveis Dark (Black) */
            --bg-body: #020617;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --grad-1: rgba(59, 130, 246, 0.15);
            --grad-2: rgba(139, 92, 246, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, var(--grad-1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, var(--grad-2) 0px, transparent 50%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: background-color 0.4s ease;
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            transition: all 0.4s ease;
        }

        .input-field {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover { transform: scale(1.1); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.8s ease-out forwards; }
    </style>
</head>
<body id="body">

    <button onclick="toggleTheme()" class="theme-toggle" id="themeBtn">
        <i class="fas fa-moon"></i>
    </button>

    <div class="w-full max-w-md px-6 animate-fade text-center">
        <div class="mb-10">
            <img src="https://i.postimg.cc/FKRT42kT/logo-finaud.png" 
                 alt="Finaudtec" class="h-20 w-auto mx-auto drop-shadow-lg">
            <p class="text-xs font-bold uppercase tracking-[0.3em] mt-4" style="color: var(--text-muted)">
                Inteligência e Gestão
            </p>
        </div>

        <div class="glass-card rounded-[2.5rem] p-10 text-left">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="mb-6 p-3 rounded-xl border text-xs font-bold flex items-center gap-2" 
                       style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #ef4444;">
                      <i class="fas fa-exclamation-circle"></i> {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest mb-2 ml-1" style="color: var(--text-muted)">E-mail Corporativo</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-xs" style="color: var(--text-muted)"></i>
                        <input type="email" name="username" required 
                               style="padding-left: 45px !important;"
                               class="input-field w-full text-sm rounded-2xl py-4 outline-none focus:border-blue-500"
                               placeholder="exemplo@finaud.com.br">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest mb-2 ml-1" style="color: var(--text-muted)">Senha de Acesso</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-xs" style="color: var(--text-muted)"></i>
                        <input type="password" id="password" name="password" required 
                               style="padding-left: 45px !important;"
                               class="input-field w-full text-sm rounded-2xl py-4 outline-none focus:border-blue-500"
                               placeholder="••••••••">
                        <button type="button" onclick="toggleSenha()" class="absolute right-4 top-1/2 -translate-y-1/2 transition" style="color: var(--text-muted)">
                            <i class="far fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between px-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-0">
                        <span class="text-xs" style="color: var(--text-muted)">Manter conectado</span>
                    </label>
                    <a href="{{ url_for('recuperar_senha') }}" class="text-xs text-blue-500 hover:text-blue-600 font-semibold">Esqueceu a senha?</a>
                </div>

                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
                    ACESSAR SISTEMA
                    <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>

        <p class="text-[10px] mt-10 uppercase tracking-[0.2em] font-medium" style="color: var(--text-muted)">
            &copy; 2026 Finaud Tec Soluções em Tecnologia Ltda. &bull; Ambiente Seguro
        </p>
    </div>

    <script>
        function toggleTheme() {
            const body = document.getElementById('body');
            const icon = document.querySelector('#themeBtn i');
            
            body.classList.toggle('dark-mode');
            
            if(body.classList.contains('dark-mode')) {
                icon.className = 'fas fa-sun';
                localStorage.setItem('theme', 'dark');
            } else {
                icon.className = 'fas fa-moon';
                localStorage.setItem('theme', 'light');
            }
        }

        // Carregar preferência ao abrir
        if(localStorage.getItem('theme') === 'dark') {
            document.getElementById('body').classList.add('dark-mode');
            document.querySelector('#themeBtn i').className = 'fas fa-sun';
        }

        function toggleSenha() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
